<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="A spoken capital-cities game for young kids, with a countdown timer and flags for 196 countries.">
<title>Capital Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Bungee&family=Noto+Color+Emoji&display=swap">
<style>
  :root {
    color-scheme: light;
    --sea: #2C63D6;
    --sea-hi: #4F8BF2;
    --sea-deep: #173A94;
    --paper: #FFFBF0;
    --paper-edge: #F1E7CC;
    --ink: #1B2548;
    --muted: #5F6A8E;
    --sun: #FFC928;
    --sun-dark: #E0A300;
    --grass: #22B864;
    --grass-dark: #168A48;
    --coral: #FF6B57;
    --coral-dark: #D24634;
    --sky: #3E7BEA;
    --sky-dark: #2553B8;
    --display: "Bungee", "Baloo 2", system-ui, sans-serif;
    --body: "Baloo 2", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    --emoji: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--body);
    color: var(--ink);
    background-color: var(--sea);
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 2px, transparent 2px 72px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 2px, transparent 2px 72px),
      radial-gradient(ellipse at 50% -10%, var(--sea-hi), var(--sea) 45%, var(--sea-deep));
    background-attachment: fixed;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  button:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
  .app {
    height: 100%;
    max-width: 780px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 14px 18px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .flag { font-family: var(--emoji); line-height: 1; }

  /* ---------- Start screen ---------- */
  #start { justify-content: center; align-items: center; gap: clamp(14px, 3vh, 26px); text-align: center; }
  .title {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(42px, 11vw, 88px);
    line-height: .95;
    color: var(--sun);
    -webkit-text-stroke: 10px var(--ink);
    paint-order: stroke fill;
    text-shadow: 0 8px 0 var(--ink);
    letter-spacing: .01em;
    transform: rotate(-3deg);
  }
  .title span { display: block; color: #fff; }
  .tagline { margin: 0; color: #fff; font-size: clamp(18px, 3.6vw, 24px); font-weight: 700; max-width: 30ch; text-wrap: balance; }
  .marquee { width: 100%; overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
  .marquee-track { display: flex; gap: 18px; width: max-content; animation: drift 40s linear infinite; font-size: clamp(36px, 7vw, 52px); }
  @keyframes drift { to { transform: translateX(-50%); } }
  .panel {
    background: var(--paper);
    border-radius: 28px;
    padding: 18px 20px;
    box-shadow: 0 10px 0 rgba(12, 30, 90, .35);
    display: grid;
    gap: 14px;
    width: 100%;
    max-width: 520px;
    box-sizing: border-box;
  }
  .opt-label { font-size: 15px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: left; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg button {
    border: 3px solid var(--paper-edge);
    background: #fff;
    border-radius: 16px;
    padding: 8px 6px 6px;
    font-size: clamp(16px, 3.4vw, 20px);
    font-weight: 800;
    line-height: 1.1;
  }
  .seg button small { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] { border-color: var(--ink); background: var(--sun); }
  .seg button[aria-pressed="true"] small { color: var(--ink); }
  .start-row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .best { color: #fff; font-weight: 700; font-size: 18px; display: inline-flex; align-items: center; gap: 6px; }
  .best svg { width: 22px; height: 22px; }

  /* ---------- Chunky buttons ---------- */
  .btn-big {
    --c: var(--grass); --d: var(--grass-dark);
    border: 0;
    border-radius: 26px;
    background: var(--c);
    color: #fff;
    font-family: var(--body);
    font-weight: 800;
    font-size: clamp(22px, 5vw, 34px);
    line-height: 1;
    padding: 20px 22px 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    box-shadow: 0 8px 0 var(--d), 0 16px 24px rgba(8, 20, 70, .25);
    transition: transform .08s ease, box-shadow .08s ease;
    text-shadow: 0 2px 0 rgba(0,0,0,.18);
  }
  .btn-big:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--d), 0 6px 10px rgba(8, 20, 70, .25); }
  .btn-big svg { width: 1.1em; height: 1.1em; flex: none; }
  .btn-big.play { --c: var(--sun); --d: var(--sun-dark); color: var(--ink); text-shadow: none; font-size: clamp(28px, 6vw, 40px); padding-inline: 44px; }
  .btn-big.skip { --c: var(--coral); --d: var(--coral-dark); }
  .btn-big.next { --c: var(--sky); --d: var(--sky-dark); }

  .icon-btn {
    width: 52px; height: 52px; border-radius: 18px; border: 0;
    background: rgba(255,255,255,.18);
    color: #fff;
    display: inline-grid; place-items: center;
  }
  .icon-btn svg { width: 26px; height: 26px; }
  .icon-btn:active { transform: scale(.94); }

  /* ---------- Game screen ---------- */
  #game { gap: clamp(12px, 2.2vh, 20px); }
  .topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .topbar .left { display: flex; gap: 8px; }
  .topbar .right { display: flex; justify-content: flex-end; }
  .ring { position: relative; width: 84px; height: 84px; border: 0; background: none; padding: 0; border-radius: 50%; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { fill: var(--paper); stroke: rgba(27, 37, 72, .12); stroke-width: 8; }
  .ring .bar { fill: none; stroke: var(--sun); stroke-width: 8; stroke-linecap: round; transition: stroke .3s; }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 26px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .ring.hurry .bar { stroke: var(--coral); }
  .ring.hurry { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.07); } }
  .stars {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--paper); border-radius: 999px; padding: 6px 16px 4px 10px;
    font-family: var(--display); font-size: 26px; color: var(--ink);
    box-shadow: 0 5px 0 rgba(12, 30, 90, .3);
    font-variant-numeric: tabular-nums;
  }
  .stars svg { width: 30px; height: 30px; }
  .stars.bump { animation: bump .45s cubic-bezier(.3,1.8,.5,1); }
  @keyframes bump { 40% { transform: scale(1.3) rotate(-6deg); } }

  .card {
    position: relative;
    flex: 1; min-height: 0;
    background: var(--paper);
    border-radius: 36px;
    box-shadow: 0 12px 0 rgba(12, 30, 90, .35);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 18px 20px;
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 10px; border-radius: 28px;
    border: 3px dashed var(--paper-edge); pointer-events: none;
  }
  .card-top { position: absolute; top: 18px; left: 22px; right: 18px; display: flex; justify-content: space-between; align-items: flex-start; }
  .cont {
    --cc: var(--sky);
    color: var(--cc);
    border: 3px solid var(--cc);
    border-radius: 12px;
    padding: 4px 12px 1px;
    font-weight: 800; font-size: 16px; letter-spacing: .1em; text-transform: uppercase;
    transform: rotate(-4deg);
    background: #fff;
  }
  .hear {
    border: 0; border-radius: 16px; background: var(--ink); color: #fff;
    width: 50px; height: 50px; display: grid; place-items: center;
  }
  .hear svg { width: 26px; height: 26px; }
  .q { display: flex; flex-direction: column; align-items: center; gap: 4px; transition: opacity .25s, filter .25s; }
  .card .flag { font-size: clamp(72px, 17vh, 150px); filter: drop-shadow(0 6px 0 rgba(27,37,72,.12)); margin-bottom: 6px; }
  .ask { margin: 0; font-size: clamp(20px, 4.4vw, 30px); font-weight: 700; color: var(--muted); }
  .country { margin: 0; font-size: clamp(38px, 9vw, 70px); font-weight: 800; line-height: 1.02; text-wrap: balance; max-width: 16ch; }
  .country.long { font-size: clamp(30px, 6.6vw, 52px); }
  .country.xlong { font-size: clamp(26px, 5.4vw, 42px); }
  .card.revealed .q { opacity: .18; filter: blur(1px); }
  .card.q-in .q { animation: slideIn .35s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes slideIn { from { transform: translateX(60px) rotate(3deg); opacity: 0; } }

  .stamp {
    --sc: var(--grass-dark);
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) rotate(-7deg);
    color: var(--sc);
    border: 6px solid var(--sc);
    outline: 3px solid var(--sc); outline-offset: 5px;
    border-radius: 22px;
    padding: 14px 22px 10px;
    background: rgba(255, 251, 240, .9);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    max-width: min(88%, 560px);
    box-sizing: border-box;
    animation: stampIn .32s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  .stamp.skipped { --sc: var(--sky-dark); }
  @keyframes stampIn {
    from { transform: translate(-50%, -50%) rotate(-18deg) scale(1.9); opacity: 0; }
  }
  .stamp-top { font-weight: 800; font-size: clamp(16px, 3.4vw, 22px); letter-spacing: .12em; text-transform: uppercase; }
  .stamp-cap { font-family: var(--display); font-size: clamp(34px, 9vw, 76px); line-height: 1.05; text-transform: uppercase; text-wrap: balance; overflow-wrap: break-word; }
  .stamp-cap.long { font-size: clamp(26px, 6.4vw, 54px); }
  .stamp-cap.xlong { font-size: clamp(20px, 4.6vw, 38px); }
  .stamp-also { font-weight: 700; font-size: clamp(15px, 3vw, 20px); }

  .confetti { position: absolute; inset: 0; pointer-events: none; }
  .confetti i {
    position: absolute; left: 50%; top: 50%;
    width: 12px; height: 18px; border-radius: 3px;
    animation: burst 1s cubic-bezier(.1,.8,.3,1) forwards;
  }
  @keyframes burst {
    to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; }
  }

  .actions { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; padding-bottom: 8px; }
  .actions.single { grid-template-columns: 1fr; }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    background: rgba(18, 38, 110, .72);
    backdrop-filter: blur(3px);
    color: #fff; text-align: center;
    border: 0; width: 100%; padding: 16px; box-sizing: border-box;
  }
  .count-num {
    font-family: var(--display); font-size: clamp(120px, 34vw, 240px); color: var(--sun);
    -webkit-text-stroke: 12px var(--ink); paint-order: stroke fill; text-shadow: 0 10px 0 var(--ink);
    animation: pop .6s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  .pause-box { display: grid; gap: 10px; justify-items: center; }
  .pause-box b { font-family: var(--display); font-weight: 400; font-size: clamp(44px, 10vw, 72px); color: var(--sun); }
  .pause-box span { font-size: 22px; font-weight: 700; }

  /* ---------- End screen ---------- */
  #end { overflow-y: auto; gap: 16px; align-items: center; text-align: center; padding-bottom: 12px; user-select: text; }
  .end-title { margin: 8px 0 0; font-family: var(--display); font-weight: 400; font-size: clamp(40px, 10vw, 72px); color: #fff; -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); transform: rotate(-2deg); }
  .score-card { background: var(--paper); border-radius: 32px; padding: 20px 28px 16px; box-shadow: 0 10px 0 rgba(12,30,90,.35); display: grid; justify-items: center; gap: 2px; }
  .score-big { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: clamp(64px, 16vw, 110px); line-height: 1; }
  .score-big svg { width: .8em; height: .8em; }
  .score-sub { font-size: 22px; font-weight: 800; }
  .newbest { background: var(--coral); color: #fff; border-radius: 999px; padding: 4px 14px 1px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 15px; transform: rotate(-3deg); margin-top: 4px; }
  .list-panel { width: 100%; background: var(--paper); border-radius: 28px; padding: 16px; box-sizing: border-box; box-shadow: 0 8px 0 rgba(12,30,90,.3); text-align: left; }
  .list-panel h3 { margin: 0 0 10px; font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .list-panel p { margin: 0; color: var(--muted); font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .mini {
    display: flex; align-items: center; gap: 10px; text-align: left;
    border: 2px solid var(--paper-edge); background: #fff; border-radius: 16px; padding: 8px 10px;
  }
  .mini .flag { font-size: 34px; }
  .mini span { display: grid; line-height: 1.1; }
  .mini small { font-size: 14px; color: var(--muted); font-weight: 700; }
  .mini b { font-size: 19px; font-weight: 800; }
  .end-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .hint { color: rgba(255,255,255,.8); font-weight: 600; font-size: 15px; margin: 0; }

  @media (max-width: 440px) {
    .actions { grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-big { padding: 18px 12px 14px; border-radius: 22px; }
    .ring { width: 72px; height: 72px; }
    .ring .num { font-size: 22px; }
    .icon-btn { width: 46px; height: 46px; }
  }
  @media (max-height: 560px) {
    .card .flag { font-size: 60px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .marquee-track, .ring.hurry, .stars.bump, .card.q-in .q, .stamp, .count-num { animation: none !important; }
  }
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-star" viewBox="0 0 24 24"><path fill="#FFC928" stroke="#1B2548" stroke-width="1.8" stroke-linejoin="round" d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.5l5 5 10-11"/></symbol>
  <symbol id="i-q" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" d="M8.5 8.5a3.6 3.6 0 1 1 5.2 3.2c-1.1.6-1.7 1.4-1.7 2.6v.5"/><circle cx="12" cy="19.5" r="1.9" fill="currentColor"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" d="M5 12h13M13 6l6 6-6 6"/></symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9h3.5L12 5v14l-4.5-4H4z"/><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9h3.5L12 5v14l-4.5-4H4z"/><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M3.5 11L12 4l8.5 7M6 9.5V20h4.5v-5h3v5H18V9.5"/></symbol>
  <symbol id="i-replay" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4v4.5H9"/></symbol>
</svg>

<div class="app">
  <!-- START -->
  <section class="screen" id="start">
    <h1 class="title">Capital<span>Quest</span></h1>
    <p class="tagline">Say the capital city out loud before the clock runs out!</p>
    <div class="marquee" aria-hidden="true"><div class="marquee-track flag" id="marquee"></div></div>
    <div class="panel">
      <div class="opt-label" id="lbl-time">How long?</div>
      <div class="seg" role="group" aria-labelledby="lbl-time" id="seg-time">
        <button type="button" id="t60" data-v="60">60<small>seconds</small></button>
        <button type="button" id="t90" data-v="90">90<small>seconds</small></button>
        <button type="button" id="t120" data-v="120">120<small>seconds</small></button>
      </div>
      <div class="opt-label" id="lbl-level">Which countries?</div>
      <div class="seg" role="group" aria-labelledby="lbl-level" id="seg-level">
        <button type="button" id="lv-easy" data-v="easy">Famous<small>best known</small></button>
        <button type="button" id="lv-mixed" data-v="mixed">Mix it up<small>famous more often</small></button>
        <button type="button" id="lv-world" data-v="world">Whole world<small>all 196, equal</small></button>
      </div>
    </div>
    <div class="start-row">
      <button type="button" class="btn-big play" id="play">Let's go!</button>
      <button type="button" class="icon-btn" id="snd1" aria-label="Sound on"><svg><use href="#i-speaker"/></svg></button>
    </div>
    <div class="best" id="bestLine" hidden><svg><use href="#i-star"/></svg><span id="bestText"></span></div>
  </section>

  <!-- GAME -->
  <section class="screen" id="game" hidden>
    <div class="topbar">
      <div class="left">
        <button type="button" class="icon-btn" id="home" aria-label="Back to start"><svg><use href="#i-home"/></svg></button>
        <button type="button" class="icon-btn" id="snd2" aria-label="Sound on"><svg><use href="#i-speaker"/></svg></button>
      </div>
      <button type="button" class="ring" id="ring" aria-label="Pause">
        <svg viewBox="0 0 84 84"><circle class="track" cx="42" cy="42" r="36"/><circle class="bar" id="bar" cx="42" cy="42" r="36"/></svg>
        <span class="num" id="secs">90</span>
      </button>
      <div class="right"><div class="stars" id="stars" aria-live="polite"><svg><use href="#i-star"/></svg><span id="starCount">0</span></div></div>
    </div>

    <div class="card" id="card">
      <div class="card-top">
        <span class="cont" id="cont">Europe</span>
        <button type="button" class="hear" id="hear" aria-label="Hear the question again"><svg><use href="#i-speaker"/></svg></button>
      </div>
      <div class="q">
        <div class="flag" id="flag"></div>
        <p class="ask">What's the capital city of</p>
        <h2 class="country" id="country">France?</h2>
      </div>
      <div class="stamp" id="stamp" hidden>
        <span class="stamp-top" id="stampTop"></span>
        <span class="stamp-cap" id="stampCap"></span>
        <span class="stamp-also" id="stampAlso" hidden></span>
      </div>
      <div class="confetti" id="confetti"></div>
    </div>

    <div class="actions" id="askRow">
      <button type="button" class="btn-big go" id="said"><svg><use href="#i-check"/></svg>I said it!</button>
      <button type="button" class="btn-big skip" id="skip"><svg><use href="#i-q"/></svg>Skip</button>
    </div>
    <div class="actions single" id="nextRow" hidden>
      <button type="button" class="btn-big next" id="next">Next<svg><use href="#i-arrow"/></svg></button>
    </div>
  </section>

  <!-- END -->
  <section class="screen" id="end" hidden>
    <h2 class="end-title">Time's up!</h2>
    <div class="score-card">
      <div class="score-big"><svg><use href="#i-star"/></svg><span id="endStars">0</span></div>
      <div class="score-sub" id="endSub"></div>
      <div class="newbest" id="newBest" hidden>New best!</div>
    </div>
    <div class="end-actions">
      <button type="button" class="btn-big play" id="again"><svg><use href="#i-replay"/></svg>Play again</button>
      <button type="button" class="btn-big next" id="toStart"><svg><use href="#i-home"/></svg>Start</button>
    </div>
    <div class="list-panel">
      <h3><svg width="24" height="24"><use href="#i-star"/></svg>Ones you knew</h3>
      <div class="cards" id="gotList"></div>
    </div>
    <div class="list-panel">
      <h3>Let's learn these next</h3>
      <div class="cards" id="skipList"></div>
    </div>
    <p class="hint">Tap any card to hear its capital.</p>
  </section>
</div>

<div class="overlay" id="countOv" hidden><div class="count-num" id="countNum">3</div></div>

VU|Vanuatu|Port Vila|3|O`;

  const CONT = {
    A: ['Africa', '#E07A12'], S: ['Asia', '#D93A45'], E: ['Europe', '#3659CF'],
    N: ['North America', '#1F9447'], U: ['South America', '#8A45C4'], O: ['Oceania', '#0E9494']
  };
  const flagOf = code => String.fromCodePoint(...[...code].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
  const COUNTRIES = RAW.trim().split('\n').map(line => {
    const [code, rawName, capital, tier, cont, also] = line.split('|');
    const the = rawName.startsWith('*');
    const name = the ? rawName.slice(1) : rawName;
    return { code, name, spoken: (the ? 'the ' : '') + name, display: (the ? 'the ' : '') + name,
             capital, tier: +tier, cont, also: also || '', flag: flagOf(code) };
  });

  const WEIGHTS = { easy: {1: 4, 2: 2, 3: 0}, mixed: {1: 4, 2: 2, 3: 1}, world: {1: 1, 2: 1, 3: 1} };

  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('cq-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('cq-' + k, JSON.stringify(v)); } catch (e) {} }
  };

  const settings = { duration: store.get('duration', 90), level: store.get('level', 'mixed'), sound: store.get('sound', true) };

  // ---------- Sound ----------
  let ac = null, voice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /en-GB/i.test(v.lang) && /female|google|samantha|serena|kate/i.test(v.name))
         || vs.find(v => /en-GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

  function say(text, onend) {
    let done = false;
    const fin = () => { if (!done) { done = true; onend && onend(); } };
    if (!settings.sound || !('speechSynthesis' in window)) { fin(); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.lang = voice ? voice.lang : 'en-GB';
      u.rate = 0.9; u.pitch = 1.1;
      u.onend = fin; u.onerror = fin;
      setTimeout(() => speechSynthesis.speak(u), 60);
      if (onend) setTimeout(fin, 4200);
    } catch (e) { fin(); }
  }
  function tone(freq, dur, type = 'sine', vol = 0.15, when = 0) {
    if (!settings.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const t = ac.currentTime + when;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }
  const sfx = {
    good() { tone(660, .16); tone(880, .16, 'sine', .15, .09); tone(1320, .35, 'sine', .12, .18); },
    thump() { tone(140, .18, 'triangle', .25); },
    skip() { tone(440, .18, 'triangle', .14); tone(349, .28, 'triangle', .12, .12); },
    tick() { tone(1050, .05, 'square', .04); },
    beep(hi) { tone(hi ? 988 : 660, hi ? .35 : .15, 'square', .06); },
    fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? .5 : .16, 'triangle', .14, i * .13)); }
  };

  // ---------- State ----------
  const st = { phase: 'start', remaining: 0, last: 0, stars: 0, got: [], skipped: [], used: new Set(), cur: null, lastWhole: null, prePause: null };
  let revealTimer = null, countTimer = null;
  const CIRC = 2 * Math.PI * 36;
  $('bar').style.strokeDasharray = CIRC;

  function show(screen) {
    ['start', 'game', 'end'].forEach(s => $(s).hidden = s !== screen);
  }

  // ---------- Start screen ----------
  function syncSeg(groupId, value) {
    $(groupId).querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v == value)));
  }
  function syncSound() {
    ['snd1', 'snd2'].forEach(id => {
      const b = $(id);
      b.querySelector('use').setAttribute('href', settings.sound ? '#i-speaker' : '#i-mute');
      b.setAttribute('aria-label', settings.sound ? 'Sound on' : 'Sound off');
    });
  }
  function bestKey() { return 'best-' + settings.duration + '-' + settings.level; }
  function syncBest() {
    const b = store.get(bestKey(), 0);
    $('bestLine').hidden = !b;
    $('bestText').textContent = 'Best score: ' + b + ' stars';
  }
  $('seg-time').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    settings.duration = +b.dataset.v; store.set('duration', settings.duration);
    syncSeg('seg-time', settings.duration); syncBest(); tone(700, .06, 'square', .05);
  });
  $('seg-level').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    settings.level = b.dataset.v; store.set('level', settings.level);
    syncSeg('seg-level', settings.level); syncBest(); tone(700, .06, 'square', .05);
  });
  const toggleSound = () => {
    settings.sound = !settings.sound; store.set('sound', settings.sound); syncSound();
    if (!settings.sound && 'speechSynthesis' in window) speechSynthesis.cancel();
  };
  $('snd1').onclick = toggleSound; $('snd2').onclick = toggleSound;

  const famous = COUNTRIES.filter(c => c.tier === 1);
  const mq = famous.map(c => c.flag).join(' ');
  $('marquee').textContent = mq + ' ' + mq;

  // ---------- Picking ----------
  function pick() {
    const w = WEIGHTS[settings.level];
    let pool = COUNTRIES.filter(c => w[c.tier] > 0 && !st.used.has(c.code));
    if (!pool.length) {
      st.used.clear();
      pool = COUNTRIES.filter(c => w[c.tier] > 0 && (!st.cur || c.code !== st.cur.code));
    }
    let total = pool.reduce((s, c) => s + w[c.tier], 0);
    let r = Math.random() * total;
    for (const c of pool) { r -= w[c.tier]; if (r <= 0) { st.used.add(c.code); return c; } }
    const c = pool[pool.length - 1]; st.used.add(c.code); return c;
  }

  // ---------- Round flow ----------
  function startRound() {
    clearTimeout(revealTimer); clearTimeout(countTimer);
    Object.assign(st, { stars: 0, got: [], skipped: [], used: new Set(), cur: null, remaining: settings.duration * 1000, lastWhole: null });
    $('starCount').textContent = '0';
    $('ring').classList.remove('hurry');
    drawRing();
    show('game');
    // placeholder card behind the countdown
    renderQuestion(pick(), false);
    st.used.clear();
    countIn();
  }
  function countIn() {
    st.phase = 'count';
    const steps = ['3', '2', '1', 'Go!'];
    let i = 0;
    $('countOv').hidden = false;
    const step = () => {
      if (st.phase !== 'count') return;
      const n = $('countNum');
      n.textContent = steps[i];
      n.style.animation = 'none'; void n.offsetWidth; n.style.animation = '';
      sfx.beep(i === 3);
      i++;
      if (i < steps.length) countTimer = setTimeout(step, 750);
      else countTimer = setTimeout(() => { $('countOv').hidden = true; nextQuestion(); }, 550);
    };
    step();
  }
  function renderQuestion(c, animate = true) {
    st.cur = c;
    const card = $('card');
    card.classList.remove('revealed', 'q-in');
    $('stamp').hidden = true;
    $('flag').textContent = c.flag;
    $('flag').setAttribute('aria-label', 'Flag of ' + c.name);
    const ct = $('country');
    ct.textContent = c.display + '?';
    ct.classList.toggle('long', c.display.length > 14 && c.display.length <= 22);
    ct.classList.toggle('xlong', c.display.length > 22);
    const [cname, ccol] = CONT[c.cont];
    const cont = $('cont');
    cont.textContent = cname; cont.style.setProperty('--cc', ccol);
    if (animate) { void card.offsetWidth; card.classList.add('q-in'); }
    $('askRow').hidden = false; $('nextRow').hidden = true;
  }
  function nextQuestion() {
    clearTimeout(revealTimer);
    if (st.remaining <= 0) { endRound(); return; }
    renderQuestion(pick());
    st.phase = 'ask';
    askAloud();
  }
  function askAloud() {
    if (st.cur) say("What's the capital city of " + st.cur.spoken + '?');
  }
  function answer(knew) {
    if (st.phase !== 'ask') return;
    st.phase = 'reveal';
    const c = st.cur;
    if (knew) {
      st.stars++; st.got.push(c);
      $('starCount').textContent = st.stars;
      const s = $('stars'); s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump');
      sfx.good(); confetti();
    } else {
      st.skipped.push(c); sfx.skip();
    }
    const stamp = $('stamp');
    stamp.classList.toggle('skipped', !knew);
    $('stampTop').textContent = knew ? c.name : "It's…";
    const cap = $('stampCap');
    cap.textContent = c.capital;
    cap.classList.toggle('long', c.capital.length > 8 && c.capital.length <= 13);
    cap.classList.toggle('xlong', c.capital.length > 13);
    const also = $('stampAlso');
    also.hidden = !c.also;
    also.textContent = c.also ? c.also + ' counts too!' : '';
    stamp.hidden = false;
    stamp.style.animation = 'none'; void stamp.offsetWidth; stamp.style.animation = '';
    $('card').classList.add('revealed');
    setTimeout(() => sfx.thump(), 180);
    $('askRow').hidden = true; $('nextRow').hidden = false;

    const t0 = performance.now();
    const minShow = knew ? 1300 : 2000;
    say((knew ? '' : "It's ") + c.capital + '!', () => {
      if (st.phase !== 'reveal' || st.cur !== c) return;
      const wait = Math.max(0, minShow - (performance.now() - t0));
      revealTimer = setTimeout(() => { if (st.phase === 'reveal' && st.cur === c) nextQuestion(); }, wait + 350);
    });
  }
  function endRound() {
    clearTimeout(revealTimer);
    st.phase = 'end';
    st.remaining = 0; drawRing();
    $('countOv').hidden = true; $('pauseOv').hidden = true;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    sfx.fanfare();

    const prev = store.get(bestKey(), 0);
    const isBest = st.stars > prev && st.stars > 0;
    if (isBest) store.set(bestKey(), st.stars);
    $('newBest').hidden = !isBest;
    $('endStars').textContent = st.stars;
    $('endSub').textContent = st.stars === 1 ? 'You said 1 capital city!' : 'You said ' + st.stars + ' capital cities!';
    fillList('gotList', st.got, 'None yet. You can do it next time!');
    fillList('skipList', st.skipped, 'Nothing skipped. Amazing!');
    show('end');
    $('end').scrollTop = 0;
    setTimeout(() => say("Time's up! You got " + st.stars + (st.stars === 1 ? ' star!' : ' stars!')), 700);
  }
  function fillList(id, arr, emptyMsg) {
    const el = $(id); el.textContent = '';
    if (!arr.length) { const p = document.createElement('p'); p.textContent = emptyMsg; el.appendChild(p); return; }
    arr.forEach(c => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'mini';
      b.innerHTML = '<span class="flag"></span><span><small></small><b></b></span>';
      b.querySelector('.flag').textContent = c.flag;
      b.querySelector('small').textContent = c.name;
      b.querySelector('b').textContent = c.capital;
      b.onclick = () => say('The capital of ' + c.spoken + ' is ' + c.capital + '.');
      el.appendChild(b);
    });
  }

  // ---------- Timer ----------
  function drawRing() {
    const total = settings.duration * 1000;
    const frac = Math.max(0, st.remaining) / total;
    $('bar').style.strokeDashoffset = CIRC * (1 - frac);
    const secs = Math.ceil(Math.max(0, st.remaining) / 1000);
    $('secs').textContent = secs;
    $('ring').classList.toggle('hurry', secs <= 10 && secs > 0 && st.phase !== 'end');
  }
  function frame(t) {
    const dt = Math.min(250, t - (st.last || t));
    st.last = t;
    if (st.phase === 'ask') {
      st.remaining -= dt;
      const whole = Math.ceil(st.remaining / 1000);
      if (whole !== st.lastWhole) {
        if (whole <= 5 && whole > 0) sfx.tick();
        st.lastWhole = whole;
      }
      drawRing();
      if (st.remaining <= 0) endRound();
    }
    requestAnimationFrame(frame);
  }

  // ---------- Pause / navigation ----------
  function pause() {
    if (st.phase !== 'ask' && st.phase !== 'reveal') return;
    st.prePause = st.phase;
    clearTimeout(revealTimer);
    st.phase = 'paused';
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    $('pauseOv').hidden = false;
  }
  function resume() {
    $('pauseOv').hidden = true;
    if (st.phase !== 'paused') return;
    if (st.prePause === 'reveal') { st.phase = 'reveal'; nextQuestion(); }
    else { st.phase = 'ask'; askAloud(); }
  }
  function goHome() {
    clearTimeout(revealTimer); clearTimeout(countTimer);
    st.phase = 'start';
    $('countOv').hidden = true; $('pauseOv').hidden = true;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    syncBest();
    show('start');
  }

  function confetti() {
    const box = $('confetti');
    const cols = ['#FFC928', '#22B864', '#FF6B57', '#3E7BEA', '#8A45C4', '#12A5A5'];
    for (let i = 0; i < 22; i++) {
      const p = document.createElement('i');
      const ang = Math.random() * Math.PI * 2, dist = 120 + Math.random() * 220;
      p.style.setProperty('--x', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--y', Math.sin(ang) * dist + 'px');
      p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      p.style.background = cols[i % cols.length];
      box.appendChild(p);
      setTimeout(() => p.remove(), 1100);
    }
  }

  // ---------- Wire up ----------
  $('play').onclick = startRound;
  $('again').onclick = startRound;
  $('toStart').onclick = goHome;
  $('home').onclick = goHome;
  $('said').onclick = () => answer(true);
  $('skip').onclick = () => answer(false);
  $('next').onclick = () => { if (st.phase === 'reveal') nextQuestion(); };
  $('hear').onclick = () => { if (st.phase === 'ask') askAloud(); else if (st.phase === 'reveal' && st.cur) say(st.cur.capital); };
  $('ring').onclick = pause;
  $('pauseOv').onclick = resume;
  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (st.phase === 'ask') {
      if (k === 'enter' || k === ' ' || k === 'y') { e.preventDefault(); answer(true); }
      else if (k === 's' || k === 'n') { e.preventDefault(); answer(false); }
      else if (k === 'p' || k === 'escape') pause();
    } else if (st.phase === 'reveal') {
      if (k === 'enter' || k === ' ' || k === 'arrowright') { e.preventDefault(); nextQuestion(); }
    } else if (st.phase === 'paused') {
      if (k === 'enter' || k === ' ' || k === 'p' || k === 'escape') { e.preventDefault(); resume(); }
    }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  function boot() {
    syncSeg('seg-time', settings.duration);
    syncSeg('seg-level', settings.level);
    syncSound(); syncBest();
    st.remaining = settings.duration * 1000; drawRing();
    requestAnimationFrame(frame);
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot();
})();
</script>
</body>
</html>
