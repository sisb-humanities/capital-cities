<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Capital Quest: a levels-and-stars capital cities game for young kids.">
<title>Capital Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Bungee&family=Noto+Color+Emoji&display=swap">
<style>
  [hidden] { display: none !important; }
  :root {
    color-scheme: light;
    --sea: #2C63D6;
    --sea-hi: #4F8BF2;
    --sea-deep: #173A94;
    --paper: #FFFBF0;
    --paper-edge: #F1E7CC;
    --paper-shadow: #DCCDA6;
    --ink: #1B2548;
    --muted: #5F6A8E;
    --sun: #FFC928;
    --sun-dark: #E0A300;
    --grass: #22B864;
    --grass-dark: #168A48;
    --coral: #FF6B57;
    --coral-dark: #D24634;
    --sky: #3E7BEA;
    --sky-dark: #2553B8;
    --locked: #B9C0D6;
    --display: "Bungee", "Baloo 2", system-ui, sans-serif;
    --body: "Baloo 2", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    --emoji: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--body);
    color: var(--ink);
    background-color: var(--sea);
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 2px, transparent 2px 72px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 2px, transparent 2px 72px),
      radial-gradient(ellipse at 50% -10%, var(--sea-hi), var(--sea) 45%, var(--sea-deep));
    background-attachment: fixed;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  button:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
  svg.i { width: 1em; height: 1em; flex: none; }
  .app {
    height: 100%;
    max-width: 800px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 14px 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .flag { font-family: var(--emoji); line-height: 1; }

  /* chunky buttons */
  .btn-big {
    --c: var(--grass); --d: var(--grass-dark);
    border: 0; border-radius: 24px;
    background: var(--c); color: #fff;
    font-weight: 800; font-size: clamp(22px, 5vw, 32px); line-height: 1;
    padding: 18px 26px 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 8px 0 var(--d), 0 14px 22px rgba(8, 20, 70, .25);
    transition: transform .08s ease, box-shadow .08s ease;
    text-shadow: 0 2px 0 rgba(0,0,0,.16);
  }
  .btn-big:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--d), 0 6px 10px rgba(8, 20, 70, .25); }
  .btn-big.sun { --c: var(--sun); --d: var(--sun-dark); color: var(--ink); text-shadow: none; }
  .btn-big.sky { --c: var(--sky); --d: var(--sky-dark); }
  .icon-btn {
    width: 52px; height: 52px; border-radius: 18px; border: 0;
    background: rgba(255,255,255,.18); color: #fff;
    display: inline-grid; place-items: center; font-size: 26px; flex: none;
  }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn.ink { background: var(--ink); }

  /* ---------- MAP ---------- */
  #map { overflow-y: auto; position: relative; gap: 18px; padding-bottom: 24px; scrollbar-width: none; }
  #map::-webkit-scrollbar { display: none; }
  .map-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo {
    margin: 0; font-family: var(--display); font-weight: 400;
    font-size: clamp(28px, 7vw, 46px); line-height: .95; color: var(--sun);
    -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink);
    transform: rotate(-3deg);
  }
  .logo span { color: #fff; display: block; }
  .head-right { display: flex; gap: 10px; align-items: center; }
  .total {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--paper); border-radius: 999px; padding: 6px 16px 3px 10px;
    font-family: var(--display); font-size: 22px; box-shadow: 0 5px 0 rgba(12,30,90,.3);
    font-variant-numeric: tabular-nums;
  }
  .total svg { width: 28px; height: 28px; }
  .total small { font-family: var(--body); font-weight: 700; font-size: 15px; color: var(--muted); }
  .world {
    background: var(--paper); border-radius: 30px; padding: 16px;
    box-shadow: 0 10px 0 rgba(12,30,90,.35);
    display: grid; gap: 12px;
  }
  .world-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .world-name { display: grid; line-height: 1.05; }
  .world-name small { font-size: 14px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--wc); }
  .world-name b { font-size: clamp(22px, 5vw, 28px); font-weight: 800; }
  .world-stars { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .world-stars svg { width: 22px; height: 22px; }
  .world.locked { opacity: .78; }
  .world-lock { font-weight: 700; color: var(--muted); margin: 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  .tile {
    position: relative;
    border: 0; border-radius: 20px;
    background: #fff;
    box-shadow: inset 0 0 0 3px var(--paper-edge), 0 6px 0 var(--paper-shadow);
    padding: 8px 6px 8px;
    display: grid; justify-items: center; gap: 4px;
    aspect-ratio: 1 / 1.08;
    align-content: space-between;
  }
  .tile:active { transform: translateY(4px); box-shadow: inset 0 0 0 3px var(--paper-edge), 0 2px 0 var(--paper-shadow); }
  .tile .tnum { font-family: var(--display); font-size: 26px; line-height: 1; color: var(--wc); }
  .tile .tflags { font-size: 16px; letter-spacing: 0; max-width: 100%; overflow: hidden; white-space: nowrap; }
  .tile .tstars { display: flex; gap: 2px; }
  .tile .tstars svg { width: 22px; height: 22px; }
  .tile.boss { grid-column: span 2; aspect-ratio: auto; background: var(--ink); color: #fff; box-shadow: 0 6px 0 #0B1230; }
  .tile.boss .tnum { color: var(--sun); font-size: 22px; display: inline-flex; align-items: center; gap: 6px; }
  .tile.boss .tnum svg { width: 28px; height: 28px; }
  .tile.locked { background: #EEF0F7; box-shadow: inset 0 0 0 3px #DDE1EE, 0 6px 0 #C9CEDF; cursor: default; }
  .tile.locked .tnum { color: var(--locked); }
  .tile.locked .tflags { filter: grayscale(1); opacity: .35; }
  .tile .lock { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; color: var(--locked); }
  .tile.boss.locked { background: #3A4466; box-shadow: 0 6px 0 #1B2548; }
  .tile.current { box-shadow: inset 0 0 0 4px var(--sun), 0 6px 0 var(--sun-dark); animation: nudge 1.6s ease-in-out infinite; }
  .tile.boss.current { box-shadow: inset 0 0 0 4px var(--sun), 0 6px 0 var(--sun-dark); }
  @keyframes nudge { 50% { transform: translateY(-4px); } }
  .map-foot { color: rgba(255,255,255,.85); text-align: center; font-weight: 600; margin: 0; }

  /* ---------- BRIEF ---------- */
  #brief { gap: 14px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .bar-title { color: #fff; font-weight: 800; font-size: 20px; text-align: center; flex: 1; }
  .brief-card {
    flex: 1; min-height: 0; overflow-y: auto;
    background: var(--paper); border-radius: 32px; padding: 20px;
    box-shadow: 0 12px 0 rgba(12,30,90,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 12px; text-align: center;
  }
  .brief-level { font-family: var(--display); font-size: clamp(34px, 8vw, 56px); line-height: 1; margin: 0; color: var(--wc); }
  .brief-sub { margin: 0; font-size: clamp(18px, 4vw, 24px); font-weight: 700; color: var(--muted); }
  .meet { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; width: 100%; }
  .meet-card {
    border: 0; background: #fff; border-radius: 22px; padding: 12px 10px 10px;
    box-shadow: inset 0 0 0 3px var(--paper-edge), 0 6px 0 var(--paper-shadow);
    display: grid; justify-items: center; gap: 2px; transition: transform .2s, box-shadow .2s;
  }
  .meet-card .flag { font-size: 54px; }
  .meet-card small { font-size: 17px; font-weight: 700; color: var(--muted); }
  .meet-card b { font-size: clamp(20px, 4.4vw, 26px); font-weight: 800; line-height: 1.1; }
  .meet-card.speaking { box-shadow: inset 0 0 0 4px var(--sun), 0 6px 0 var(--sun-dark); transform: scale(1.04); }
  .boss-flags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; font-size: 38px; max-width: 560px; }
  .goal { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .goal span {
    display: inline-flex; align-items: center; gap: 4px;
    background: #fff; border-radius: 999px; padding: 6px 12px 3px;
    box-shadow: inset 0 0 0 2px var(--paper-edge);
    font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums;
  }
  .goal svg { width: 20px; height: 20px; }
  .brief-note { margin: 0; color: var(--muted); font-weight: 600; font-size: 16px; }
  .brief-go { display: flex; justify-content: center; padding-bottom: 8px; }
  .brief-go .btn-big { min-width: 60%; font-size: clamp(28px, 6vw, 38px); }

  /* ---------- GAME ---------- */
  #game { gap: 12px; }
  .topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .topbar .right { display: flex; justify-content: flex-end; gap: 4px; }
  .hearts svg { width: 38px; height: 38px; transition: transform .2s; }
  .hearts svg.lost { filter: grayscale(1); opacity: .35; }
  .hearts svg.breaking { animation: heartbreak .6s ease; }
  @keyframes heartbreak { 30% { transform: scale(1.4) rotate(-12deg); } 60% { transform: scale(.8) rotate(8deg); } }
  .ring { position: relative; width: 80px; height: 80px; border: 0; background: none; padding: 0; border-radius: 50%; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { fill: var(--paper); stroke: rgba(27, 37, 72, .12); stroke-width: 8; }
  .ring .rbar { fill: none; stroke: var(--sun); stroke-width: 8; stroke-linecap: round; transition: stroke .3s; }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 25px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .ring.held .rbar { stroke: #9FB3E0; }
  .ring.hurry .rbar { stroke: var(--coral); }
  .ring.hurry { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.07); } }

  .starbar {
    background: var(--paper); border-radius: 999px; padding: 8px 18px 8px 12px;
    box-shadow: 0 6px 0 rgba(12,30,90,.3);
    display: flex; align-items: center; gap: 12px;
  }
  .sb-count { font-family: var(--display); font-size: 22px; min-width: 2.2ch; text-align: center; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 4px; color: var(--grass-dark); }
  .sb-count svg { width: 22px; height: 22px; color: var(--grass); }
  .sb-track { position: relative; flex: 1; height: 18px; border-radius: 999px; background: #E9E1C8; margin-right: 12px; }
  .sb-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--sun), #FFB000); transition: width .4s cubic-bezier(.3,1.4,.5,1); }
  .sb-mark { position: absolute; top: 50%; width: 36px; height: 36px; transform: translate(-50%, -50%); }
  .sb-mark svg { width: 100%; height: 100%; }
  .sb-mark.on svg { animation: starpop .5s cubic-bezier(.3,1.8,.5,1); }
  @keyframes starpop { 40% { transform: scale(1.6) rotate(-15deg); } }

  .card {
    position: relative; flex: 1; min-height: 0;
    background: var(--paper); border-radius: 32px;
    box-shadow: 0 12px 0 rgba(12, 30, 90, .35);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 14px 18px; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; inset: 9px; border-radius: 25px; border: 3px dashed var(--paper-edge); pointer-events: none; }
  .card-top { position: absolute; top: 16px; left: 20px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; }
  .lvl-tag { color: var(--wc); border: 3px solid var(--wc); border-radius: 12px; padding: 3px 10px 0; font-weight: 800; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; transform: rotate(-4deg); background: #fff; }
  .hear { border: 0; border-radius: 16px; background: var(--ink); color: #fff; width: 50px; height: 50px; display: grid; place-items: center; font-size: 26px; }
  .card .flag { font-size: clamp(64px, 15vh, 140px); filter: drop-shadow(0 6px 0 rgba(27,37,72,.12)); margin-bottom: 4px; }
  .ask { margin: 0; font-size: clamp(18px, 4vw, 26px); font-weight: 700; color: var(--muted); }
  .country { margin: 0; font-size: clamp(34px, 8vw, 62px); font-weight: 800; line-height: 1.02; text-wrap: balance; max-width: 16ch; }
  .country.long { font-size: clamp(28px, 6vw, 46px); }
  .country.xlong { font-size: clamp(24px, 5vw, 38px); }
  .card.q-in .qwrap { animation: slideIn .35s cubic-bezier(.2,.9,.3,1.2); }
  .qwrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  @keyframes slideIn { from { transform: translateX(60px) rotate(3deg); opacity: 0; } }
  .listen { position: absolute; bottom: 16px; left: 0; right: 0; font-weight: 800; color: var(--sky-dark); font-size: 17px; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
  .confetti { position: absolute; inset: 0; pointer-events: none; }
  .confetti i { position: absolute; left: 50%; top: 50%; width: 12px; height: 18px; border-radius: 3px; animation: burst 1s cubic-bezier(.1,.8,.3,1) forwards; }
  @keyframes burst { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 8px; }
  .options.n3 .opt:last-child { grid-column: span 2; }
  .opt {
    border: 0; border-radius: 22px; background: #fff; color: var(--ink);
    box-shadow: inset 0 0 0 4px var(--paper-edge), 0 7px 0 var(--paper-shadow), 0 12px 18px rgba(8,20,70,.2);
    font-weight: 800; font-size: clamp(22px, 5vw, 34px); line-height: 1.05;
    min-height: clamp(70px, 11vh, 96px); padding: 12px 10px 8px;
    transition: transform .12s, background .15s, box-shadow .15s, opacity .2s;
    text-wrap: balance; overflow-wrap: break-word;
  }
  .opt.long { font-size: clamp(18px, 4vw, 26px); }
  .opt:active:not(.locked) { transform: translateY(5px); box-shadow: inset 0 0 0 4px var(--paper-edge), 0 2px 0 var(--paper-shadow); }
  .opt.locked { cursor: default; }
  .opt.reading { background: #FFF1BF; box-shadow: inset 0 0 0 5px var(--sun), 0 7px 0 var(--sun-dark); transform: scale(1.04); }
  .opt.right { background: var(--grass); color: #fff; box-shadow: inset 0 0 0 4px var(--grass-dark), 0 7px 0 var(--grass-dark); }
  .opt.wrong { background: var(--coral); color: #fff; box-shadow: inset 0 0 0 4px var(--coral-dark), 0 7px 0 var(--coral-dark); animation: shake .45s; }
  .opt.dim { opacity: .4; }
  .opt.reveal { animation: glow 1s ease-in-out 2; }
  @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  @keyframes glow { 50% { transform: scale(1.06); } }

  /* ---------- OVERLAYS ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    background: rgba(18, 38, 110, .72); backdrop-filter: blur(3px);
    padding: 16px; box-sizing: border-box; border: 0; width: 100%; color: var(--ink);
  }
  .pause-box { display: grid; gap: 8px; justify-items: center; color: #fff; }
  .pause-box b { font-family: var(--display); font-weight: 400; font-size: clamp(44px, 10vw, 72px); color: var(--sun); }
  .pause-box span { font-size: 22px; font-weight: 700; }
  .result-card {
    background: var(--paper); border-radius: 36px; padding: 22px 22px 20px;
    box-shadow: 0 12px 0 rgba(12,30,90,.4);
    width: min(100%, 460px); box-sizing: border-box;
    display: grid; justify-items: center; gap: 10px; text-align: center;
    animation: rise .35s cubic-bezier(.2,1.3,.4,1);
  }
  @keyframes rise { from { transform: translateY(40px) scale(.9); opacity: 0; } }
  .res-title { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(32px, 8vw, 48px); line-height: 1; }
  .res-stars { display: flex; align-items: flex-end; gap: 6px; height: 110px; }
  .res-stars svg { width: 78px; height: 78px; transition: transform .2s; }
  .res-stars svg:nth-child(2) { width: 100px; height: 100px; transform: translateY(-14px); }
  .res-stars svg.pop { animation: bigpop .5s cubic-bezier(.3,1.8,.5,1); }
  .res-stars svg:nth-child(2).pop { animation: bigpop2 .5s cubic-bezier(.3,1.8,.5,1); }
  @keyframes bigpop { from { transform: scale(0) rotate(-40deg); } }
  @keyframes bigpop2 { from { transform: translateY(-14px) scale(0) rotate(-40deg); } }
  .res-sub { margin: 0; font-size: 20px; font-weight: 700; color: var(--muted); text-wrap: balance; }
  .res-actions { display: flex; gap: 12px; align-items: center; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
  .res-actions .icon-btn { width: 64px; height: 64px; border-radius: 20px; font-size: 30px; box-shadow: 0 6px 0 #0B1230; }
  .grown-card {
    background: var(--paper); border-radius: 30px; padding: 20px;
    width: min(100%, 440px); box-sizing: border-box; display: grid; gap: 12px;
    box-shadow: 0 12px 0 rgba(12,30,90,.4);
  }
  .grown-card h2 { margin: 0; font-size: 26px; font-weight: 800; }
  .grown-card p { margin: 0; color: var(--muted); font-weight: 600; line-height: 1.35; }
  .switch {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    border: 0; background: #fff; border-radius: 16px; padding: 12px 14px;
    box-shadow: inset 0 0 0 2px var(--paper-edge);
    font-size: 19px; font-weight: 700; text-align: left;
  }
  .switch .knob { width: 52px; height: 30px; border-radius: 999px; background: var(--locked); position: relative; flex: none; transition: background .2s; }
  .switch .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch[aria-pressed="true"] .knob { background: var(--grass); }
  .switch[aria-pressed="true"] .knob::after { transform: translateX(22px); }
  .plain-btn { border: 0; background: #fff; border-radius: 16px; padding: 12px 14px; box-shadow: inset 0 0 0 2px var(--paper-edge); font-size: 18px; font-weight: 700; text-align: left; }
  .plain-btn.danger { color: var(--coral-dark); }
  .plain-btn.armed { background: var(--coral); color: #fff; box-shadow: none; }

  @media (max-width: 440px) {
    .options { gap: 10px; }
    .ring { width: 70px; height: 70px; }
    .ring .num { font-size: 21px; }
    .hearts svg { width: 30px; height: 30px; }
    .icon-btn { width: 46px; height: 46px; font-size: 23px; }
    .tiles { grid-template-columns: repeat(3, 1fr); }
    .res-stars svg { width: 64px; height: 64px; }
    .res-stars svg:nth-child(2) { width: 82px; height: 82px; }
  }
  @media (max-height: 620px) {
    .card .flag { font-size: 54px; }
    .opt { min-height: 60px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-star" viewBox="0 0 24 24"><path fill="#FFC928" stroke="#1B2548" stroke-width="1.8" stroke-linejoin="round" d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></symbol>
  <symbol id="i-star-off" viewBox="0 0 24 24"><path fill="#E4DCC3" stroke="#C9BC98" stroke-width="1.8" stroke-linejoin="round" d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></symbol>

  const BY = {};
  RAW.trim().split('\n').forEach(line => {
    const [code, rawName, capital, tier, cont, also] = line.split('|');
    const the = rawName.startsWith('*');

    BY[code] = { code, name, spoken: (the ? 'the ' : '') + name, capital, flag: flagOf(code), also: also || '' };
  });
  const ALL = Object.keys(BY);

  // Worlds, easiest first. Within a world, better-known countries come first.
  const WORLDS = [
    { name: 'Southeast Asia', tag: 'World 1 · Home', col: '#D93A45', codes: 'TH LA KH MY VN SG MM ID PH BN TL' },
    { name: 'East & South Asia', tag: 'World 2', col: '#E0671A', codes: 'CN JP KR IN TW KP MN NP BT BD PK LK MV AF' },

    { name: 'North America', tag: 'World 4', col: '#1F9447', codes: 'US CA MX CU JM PA CR BS DO HT GT HN SV NI BZ TT BB AG DM GD KN LC VC' },
    { name: 'South America', tag: 'World 5', col: '#8A45C4', codes: 'BR AR CL PE CO VE BO EC UY PY GY SR' },
    { name: 'Oceania', tag: 'World 6', col: '#0E8C8C', codes: 'AU NZ FJ PG WS TO VU SB KI TV NR PW FM MH' },
    { name: 'Northern & Eastern Europe', tag: 'World 7', col: '#2F6FB0', codes: 'RU SE NO DK FI IS PL UA CZ HU RO BG HR RS SK SI EE LV LT BY MD AL BA ME MK XK CY' },
    { name: 'Middle East & Central Asia', tag: 'World 8', col: '#B5651D', codes: 'TR SA AE IL QA IR IQ KW JO LB SY OM BH YE GE AM AZ KZ UZ TM KG TJ' },
    { name: 'North & West Africa', tag: 'World 9', col: '#B7860B', codes: 'EG MA NG GH DZ TN LY SN ML NE BF CI GN SL LR GM GW CV MR TG BJ TD' },

  function chunkEven(arr, size) {
    const n = Math.ceil(arr.length / size), out = [];
    let i = 0;
    for (let k = 0; k < n; k++) { const len = Math.round((arr.length - i) / (n - k)); out.push(arr.slice(i, i + len)); i += len; }
    return out;
  }
  function optCount(wi, j, boss) {
    if (wi === 0) return boss ? 3 : (j < 2 ? 2 : 3);
    if (wi <= 3) return boss ? 4 : 3;
    return 4;
  }
  const LEVELS = [];
  WORLDS.forEach((w, wi) => {
    w.codes = w.codes.split(' ');
    w.first = LEVELS.length;
    const chunks = chunkEven(w.codes, 4);
    let seen = [];
    chunks.forEach((ch, j) => {
      const review = j > 0 ? seen.slice() : (wi > 0 ? WORLDS[wi - 1].codes : []);
      LEVELS.push({ id: wi + '-' + j, wi, num: j + 1, boss: false, fresh: ch, review, options: optCount(wi, j, false), time: 30, targets: [5, 7, 9] });
      seen = seen.concat(ch);
    });
    LEVELS.push({ id: wi + '-b', wi, num: chunks.length + 1, boss: true, fresh: w.codes, review: [], options: optCount(wi, 0, true), time: 45, targets: [7, 10, 13] });

  LEVELS.forEach((l, i) => l.index = i);

  // ---------- storage ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('cq2-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('cq2-' + k, JSON.stringify(v)); } catch (e) {} }
  };
  const progress = Object.assign({ stars: {}, unlockAll: false }, store.get('progress', {}));
  const settings = Object.assign({ sound: true, readAnswers: true }, store.get('settings', {}));
  const saveProgress = () => store.set('progress', progress);
  const saveSettings = () => store.set('settings', settings);
  const starsOf = l => progress.stars[l.id] || 0;
  const unlocked = l => progress.unlockAll || l.index === 0 || starsOf(LEVELS[l.index - 1]) > 0;

  const $ = id => document.getElementById(id);
  const svgUse = (id, cls) => `<svg${cls ? ` class="${cls}"` : ''}><use href="#${id}"/></svg>`;
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- speech ----------
  const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
  let voice = null, seq = 0;
  function pickVoice() {
    if (!synth) return;
    const vs = synth.getVoices();
    voice = vs.find(v => /en-GB/i.test(v.lang) && /female|google|samantha|serena|kate|libby|sonia/i.test(v.name))
         || vs.find(v => /en-GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
  function stopSpeech() { seq++; if (synth) try { synth.cancel(); } catch (e) {} }
  // items: [{text, on, gap}] spoken in order; done() when finished (or quickly if sound is off)
  function speakSeq(items, done) {
    const my = ++seq;
    if (!settings.sound || !synth) { setTimeout(() => { if (my === seq) done && done(); }, 650); return; }
    try { synth.cancel(); } catch (e) {}
    let i = 0;
    const next = () => {
      if (my !== seq) return;
      if (i >= items.length) { done && done(); return; }
      const it = items[i++];
      it.on && it.on();
      let fired = false, fb;
      const go = () => { if (fired) return; fired = true; clearTimeout(fb); setTimeout(next, it.gap ?? 150); };
      try {
        const u = new SpeechSynthesisUtterance(it.text);
        if (voice) u.voice = voice;
        u.lang = voice ? voice.lang : 'en-GB';
        u.rate = 0.9; u.pitch = 1.1;
        u.onend = go; u.onerror = go;
        fb = setTimeout(go, 1500 + it.text.length * 95);
        synth.speak(u);
      } catch (e) { go(); }
    };
    next();
  }
  const say = (text, done) => speakSeq([{ text }], done);

  // ---------- sound effects ----------
  let ac = null;
  function tone(freq, dur, type = 'sine', vol = 0.15, when = 0) {
    if (!settings.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }
  const sfx = {
    good() { tone(660, .15); tone(880, .15, 'sine', .15, .08); tone(1320, .3, 'sine', .12, .16); },
    wrong() { tone(220, .22, 'sawtooth', .07); tone(165, .35, 'sawtooth', .06, .15); },
    star(i) { tone(784 * Math.pow(1.26, i), .3, 'triangle', .14); tone(1568 * Math.pow(1.26, i), .2, 'sine', .06, .05); },
    tick() { tone(1050, .05, 'square', .04); },
    tap() { tone(700, .06, 'square', .05); },
    fail() { [392, 330, 262].forEach((f, i) => tone(f, .25, 'triangle', .12, i * .18)); },
    fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? .5 : .16, 'triangle', .14, i * .12)); }
  };

  // ---------- screens ----------
  function show(id) { ['map', 'brief', 'game'].forEach(s => $(s).hidden = s !== id); }

  // ---------- MAP ----------
  function renderMap() {
    const total = LEVELS.reduce((s, l) => s + starsOf(l), 0);
    $('totalStars').textContent = total;
    $('maxStars').textContent = LEVELS.length * 3;
    const current = LEVELS.find(l => unlocked(l) && starsOf(l) === 0) || null;
    const box = $('worlds'); box.textContent = '';
    WORLDS.forEach((w, wi) => {
      const levels = LEVELS.filter(l => l.wi === wi);
      const got = levels.reduce((s, l) => s + starsOf(l), 0);
      const open = unlocked(levels[0]);
      const sec = document.createElement('section');
      sec.className = 'world' + (open ? '' : ' locked');
      sec.style.setProperty('--wc', w.col);
      sec.innerHTML = `<div class="world-head"><div class="world-name"><small></small><b></b></div><div class="world-stars">${svgUse('i-star')}<span></span></div></div>`;
      sec.querySelector('small').textContent = w.tag;
      sec.querySelector('b').textContent = w.name;
      sec.querySelector('.world-stars span').textContent = got + ' / ' + levels.length * 3;
      if (!open && wi > 0) {
        const p = document.createElement('p'); p.className = 'world-lock';
        p.textContent = 'Beat the ' + WORLDS[wi - 1].name + ' boss to open this world.';
        sec.appendChild(p);
      }
      const tiles = document.createElement('div'); tiles.className = 'tiles';
      levels.forEach(l => {
        const b = document.createElement('button');
        b.type = 'button';
        const isOpen = unlocked(l), s = starsOf(l);
        b.className = 'tile' + (l.boss ? ' boss' : '') + (isOpen ? '' : ' locked') + (l === current ? ' current' : '');
        b.id = 'tile-' + l.id;
        const flags = l.boss ? '' : l.fresh.map(c => BY[c].flag).join('');
        b.innerHTML = (l.boss ? `<span class="tnum">${svgUse('i-crown')}BOSS</span>` : `<span class="tnum">${l.num}</span>`)
          + `<span class="tflags flag">${flags}</span>`
          + `<span class="tstars">${[0, 1, 2].map(i => svgUse(i < s ? 'i-star' : 'i-star-off')).join('')}</span>`
          + (isOpen ? '' : svgUse('i-lock', 'lock'));
        b.setAttribute('aria-label', (l.boss ? 'Boss level, ' : 'Level ' + l.num + ', ') + w.name + (isOpen ? ', ' + s + ' stars' : ', locked'));
        b.onclick = () => { if (!isOpen) { sfx.wrong(); return; } sfx.tap(); openBrief(l); };
        tiles.appendChild(b);
      });
      sec.appendChild(tiles);
      box.appendChild(sec);
    });
    return current;
  }
  function goMap() {
    stopSpeech(); stopGame();
    $('resultOv').hidden = true; $('pauseOv').hidden = true;
    const cur = renderMap();
    show('map');
    const m = $('map');
    if (cur) {
      const t = $('tile-' + cur.id);
      if (t) m.scrollTop = Math.max(0, t.offsetTop - m.clientHeight / 2 + t.offsetHeight / 2);
    }
  }

  // ---------- BRIEF ----------
  let briefLevel = null;
  function openBrief(l) {
    briefLevel = l;
    stopSpeech();
    const w = WORLDS[l.wi];
    $('brief').style.setProperty('--wc', w.col);
    $('briefWorld').textContent = w.name;
    $('briefLevel').textContent = l.boss ? 'Boss level!' : 'Level ' + l.num;
    const meet = $('meet'), bf = $('bossFlags');
    meet.textContent = '';
    const [t1, t2, t3] = l.targets;
    $('goal').innerHTML = `<span>${svgUse('i-star')}${t1}</span><span>${svgUse('i-star')}${svgUse('i-star')}${t2}</span><span>${svgUse('i-star')}${svgUse('i-star')}${svgUse('i-star')}${t3}</span>`;
    if (l.boss) {
      $('briefSub').textContent = 'Every capital in ' + w.name;
      meet.hidden = true; bf.hidden = false;
      bf.textContent = l.fresh.map(c => BY[c].flag).join(' ');
      $('briefNote').textContent = l.time + ' seconds and 3 hearts. Get ' + t1 + ' right to win.';
      show('brief');
      say('Boss level! Every capital in ' + w.name + '. Get ' + t1 + ' right to win!');
    } else {
      $('briefSub').textContent = 'Meet these capitals';
      meet.hidden = false; bf.hidden = true;
      const cards = l.fresh.map(code => {
        const c = BY[code];
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'meet-card';
        b.innerHTML = '<span class="flag"></span><small></small><b></b>';
        b.querySelector('.flag').textContent = c.flag;
        b.querySelector('small').textContent = c.name;
        b.querySelector('b').textContent = c.capital;
        b.onclick = () => { meet.querySelectorAll('.speaking').forEach(x => x.classList.remove('speaking')); b.classList.add('speaking'); say('The capital of ' + c.spoken + ' is ' + c.capital + '.', () => b.classList.remove('speaking')); };
        meet.appendChild(b);
        return { b, c };
      });
      $('briefNote').textContent = (l.review.length ? 'Plus some you know already. ' : '') + l.time + ' seconds and 3 hearts. Get ' + t1 + ' right to pass.';
      show('brief');
      $('briefCard').scrollTop = 0;
      const items = cards.map(({ b, c }) => ({
        text: 'The capital of ' + c.spoken + ' is ' + c.capital + '.',
        gap: 350,
        on: () => { cards.forEach(x => x.b.classList.remove('speaking')); b.classList.add('speaking'); }
      }));
      speakSeq(items, () => cards.forEach(x => x.b.classList.remove('speaking')));
    }
  }
  $('briefBack').onclick = goMap;
  $('briefPlay').onclick = () => { if (briefLevel) startLevel(briefLevel); };

  // ---------- GAME ----------
  const CIRC = 2 * Math.PI * 36;
  $('rbar').style.strokeDasharray = CIRC;
  let G = null, feedbackTimer = null;

  function stopGame() {
    clearTimeout(feedbackTimer);
    if (G) G.phase = 'done';
  }
  function startLevel(l) {
    stopSpeech(); clearTimeout(feedbackTimer);
    $('resultOv').hidden = true;
    const w = WORLDS[l.wi];
    $('game').style.setProperty('--wc', w.col);
    $('lvlTag').textContent = l.boss ? 'Boss' : 'Level ' + l.num;
    const pool = l.fresh.map(code => ({ code, w: l.boss ? 1 : 3 }));
    shuffle(l.review.slice()).slice(0, 4).forEach(code => pool.push({ code, w: 1 }));
    G = { level: l, pool, hearts: 3, correct: 0, remaining: l.time * 1000, phase: 'reading', cur: null, opts: [], qn: 0, retry: [], lastCode: null, lastWhole: null, prePause: null };
    // star bar markers
    const tr = $('sbTrack');
    tr.querySelectorAll('.sb-mark').forEach(m => m.remove());
    l.targets.forEach((t, i) => {
      const m = document.createElement('span');
      m.className = 'sb-mark'; m.id = 'sbm' + i;
      m.style.left = (t / l.targets[2] * 100) + '%';
      m.innerHTML = svgUse('i-star-off');
      tr.appendChild(m);
    });
    updateStarbar();
    renderHearts();
    drawRing();
    show('game');
    nextQuestion();
  }
  function renderHearts(breakIdx) {
    const h = $('hearts'); h.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const cls = i >= G.hearts ? (i === breakIdx ? 'lost breaking' : 'lost') : '';
      h.insertAdjacentHTML('beforeend', svgUse('i-heart', cls));
    }
  }
  function updateStarbar() {
    const [t1, t2, t3] = G.level.targets;
    $('sbCount').textContent = G.correct;
    $('sbFill').style.width = Math.min(100, G.correct / t3 * 100) + '%';
    [t1, t2, t3].forEach((t, i) => {
      const m = $('sbm' + i); if (!m) return;
      const on = G.correct >= t;
      if (on && !m.classList.contains('on')) { m.classList.add('on'); m.innerHTML = svgUse('i-star'); sfx.star(i); }
    });
  }
  function pickQuestion() {
    G.qn++;
    const due = G.retry.findIndex(r => r.due <= G.qn && r.code !== G.lastCode);
    if (due >= 0) return BY[G.retry.splice(due, 1)[0].code];
    const cands = G.pool.filter(p => p.code !== G.lastCode);
    let total = cands.reduce((s, p) => s + p.w, 0), r = Math.random() * total;
    for (const p of cands) { r -= p.w; if (r <= 0) return BY[p.code]; }
    return BY[cands[cands.length - 1].code];
  }
  function makeOptions(c) {
    const n = G.level.options;
    const used = new Set([c.capital]);
    const out = [c];
    const sources = [shuffle(G.pool.map(p => p.code)), shuffle(WORLDS[G.level.wi].codes.slice()), shuffle(ALL.slice())];
    for (const src of sources) {
      for (const code of src) {
        if (out.length >= n) break;
        const d = BY[code];
        if (!used.has(d.capital)) { used.add(d.capital); out.push(d); }
      }
    }
    return shuffle(out);
  }
  function nextQuestion() {
    clearTimeout(feedbackTimer);
    if (!G || G.phase === 'done') return;
    if (G.remaining <= 0) { finishLevel('time'); return; }
    const c = pickQuestion();
    G.cur = c; G.lastCode = c.code;
    G.opts = makeOptions(c);
    // render question
    const card = $('card');
    card.classList.remove('q-in'); void card.offsetWidth; card.classList.add('q-in');
    $('flag').textContent = c.flag;
    const ct = $('country');
    ct.textContent = c.spoken + '?';
    ct.classList.toggle('long', c.spoken.length > 14 && c.spoken.length <= 22);
    ct.classList.toggle('xlong', c.spoken.length > 22);
    const box = $('options');
    box.className = 'options n' + G.opts.length;
    box.textContent = '';
    G.opts.forEach((o, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt locked' + (o.capital.length > 13 ? ' long' : '');
      b.textContent = o.capital;
      b.onclick = () => choose(i);
      box.appendChild(b);
    });
    readQuestion();
  }
  function readQuestion() {
    G.phase = 'reading';
    const btns = [...$('options').children];
    btns.forEach(b => { b.classList.add('locked'); b.classList.remove('reading'); });
    $('listen').hidden = !settings.sound;
    drawRing();
    const c = G.cur;
    const items = [{ text: "What's the capital of " + c.spoken + '?', gap: 300 }];
    if (settings.readAnswers) {
      G.opts.forEach((o, i) => {
        const last = i === G.opts.length - 1;
        items.push({ text: (last ? 'or ' : '') + o.capital + '?', gap: 220, on: () => { btns.forEach(b => b.classList.remove('reading')); btns[i].classList.add('reading'); } });
      });
    }
    const q = G.qn;
    speakSeq(items, () => {
      if (!G || G.phase !== 'reading' || G.qn !== q) return;
      btns.forEach(b => b.classList.remove('reading', 'locked'));
      $('listen').hidden = true;
      G.phase = 'ask';
      drawRing();
    });
  }
  const PRAISE = ['Yes!', 'Great!', 'Brilliant!', 'Well done!', 'Super!', 'You got it!'];
  function choose(i) {
    if (!G || G.phase !== 'ask') return;
    G.phase = 'feedback';
    drawRing();
    const btns = [...$('options').children];
    const c = G.cur, ok = G.opts[i].code === c.code;
    const rightIdx = G.opts.findIndex(o => o.code === c.code);
    btns.forEach(b => b.classList.add('locked'));
    const t0 = performance.now();
    let minShow, words;
    if (ok) {
      btns[i].classList.add('right');
      btns.forEach((b, k) => { if (k !== i) b.classList.add('dim'); });
      G.correct++;
      sfx.good(); confetti();
      updateStarbar();
      minShow = 900;
      words = PRAISE[Math.floor(Math.random() * PRAISE.length)] + ' ' + c.capital + '!';
    } else {
      btns[i].classList.add('wrong');
      btns[rightIdx].classList.add('right', 'reveal');
      btns.forEach((b, k) => { if (k !== i && k !== rightIdx) b.classList.add('dim'); });
      G.hearts--;
      renderHearts(G.hearts);
      sfx.wrong();
      G.retry.push({ code: c.code, due: G.qn + 2 });
      minShow = 2000;
      words = 'Oops! The capital of ' + c.spoken + ' is ' + c.capital + '.';
    }
    const q = G.qn;
    say(words, () => {
      if (!G || G.phase !== 'feedback' || G.qn !== q) return;
      const wait = Math.max(0, minShow - (performance.now() - t0));
      feedbackTimer = setTimeout(() => {
        if (!G || G.phase !== 'feedback' || G.qn !== q) return;
        if (G.correct >= G.level.targets[2]) finishLevel('perfect');
        else if (G.hearts <= 0) finishLevel('hearts');
        else nextQuestion();
      }, wait + 250);
    });
  }
  function drawRing() {
    if (!G) return;
    const total = G.level.time * 1000;
    $('rbar').style.strokeDashoffset = CIRC * (1 - Math.max(0, G.remaining) / total);
    const secs = Math.ceil(Math.max(0, G.remaining) / 1000);
    $('secs').textContent = secs;
    const ring = $('ring');
    ring.classList.toggle('held', G.phase !== 'ask');
    ring.classList.toggle('hurry', G.phase === 'ask' && secs <= 5 && secs > 0);
  }
  let lastT = 0;
  function frame(t) {
    const dt = Math.min(250, t - (lastT || t));
    lastT = t;
    if (G && G.phase === 'ask') {
      G.remaining -= dt;
      const whole = Math.ceil(G.remaining / 1000);
      if (whole !== G.lastWhole) { if (whole <= 5 && whole > 0) sfx.tick(); G.lastWhole = whole; }
      drawRing();
      if (G.remaining <= 0) finishLevel('time');
    }
    requestAnimationFrame(frame);
  }
  function finishLevel(reason) {
    if (!G || G.phase === 'done') return;
    clearTimeout(feedbackTimer);
    G.phase = 'done';
    G.remaining = Math.max(0, G.remaining);
    drawRing();
    stopSpeech();
    const l = G.level, [t1, t2, t3] = l.targets, n = G.correct;
    const stars = n >= t3 ? 3 : n >= t2 ? 2 : n >= t1 ? 1 : 0;
    const prev = starsOf(l);
    if (stars > prev) { progress.stars[l.id] = stars; saveProgress(); }
    const titles = ['', 'You passed!', 'Great job!', 'Amazing!'];
    let title = titles[stars], sub, speech;
    if (stars === 0) {
      title = reason === 'hearts' ? 'Out of hearts!' : 'So close!';
      sub = 'You got ' + n + ' right. Get ' + t1 + ' to pass.';
      speech = (reason === 'hearts' ? 'Out of hearts! ' : 'Time is up! ') + 'You got ' + n + '. Try again!';
    } else if (stars < 3) {
      sub = 'You got ' + n + ' right. Get ' + (stars === 1 ? t2 : t3) + ' for ' + (stars === 1 ? 'two' : 'three') + ' stars.';
      speech = title + ' ' + (stars === 1 ? 'One star!' : 'Two stars!');
    } else {
      sub = 'Three stars! You got ' + n + ' right.';
      speech = 'Amazing! Three stars!';
    }
    if (l.boss && stars > 0 && l.wi < WORLDS.length - 1 && prev === 0) sub += ' New world open: ' + WORLDS[l.wi + 1].name + '!';
    $('resTitle').textContent = title;
    $('resSub').textContent = sub;
    const rs = $('resStars');
    rs.innerHTML = [0, 1, 2].map(() => svgUse('i-star-off')).join('');
    const nextL = LEVELS[l.index + 1];
    $('resNext').hidden = !(nextL && unlocked(nextL));
    $('resultOv').hidden = false;
    setTimeout(() => {
      if (stars === 0) sfx.fail();
      for (let i = 0; i < stars; i++) {
        setTimeout(() => {
          const s = rs.children[i];
          s.querySelector('use').setAttribute('href', '#i-star');
          s.classList.add('pop');
          sfx.star(i);
        }, 380 * i);
      }
      setTimeout(() => { if (stars === 3) sfx.fanfare(); say(speech); }, 380 * stars + 200);
    }, 350);
  }
  function confetti() {
    const box = $('confetti');
    const cols = ['#FFC928', '#22B864', '#FF6B57', '#3E7BEA', '#8A45C4', '#12A5A5'];
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('i');
      const ang = Math.random() * Math.PI * 2, dist = 110 + Math.random() * 200;
      p.style.setProperty('--x', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--y', Math.sin(ang) * dist + 'px');
      p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      p.style.background = cols[i % cols.length];
      box.appendChild(p);
      setTimeout(() => p.remove(), 1100);
    }
  }

  // pause
  function pause() {
    if (!G || !['reading', 'ask', 'feedback'].includes(G.phase)) return;
    G.prePause = G.phase;
    clearTimeout(feedbackTimer);
    stopSpeech();
    G.phase = 'paused';
    drawRing();
    $('pauseOv').hidden = false;
  }
  function resume() {
    $('pauseOv').hidden = true;
    if (!G || G.phase !== 'paused') return;
    if (G.prePause === 'feedback') {
      G.phase = 'feedback';
      if (G.correct >= G.level.targets[2]) finishLevel('perfect');
      else if (G.hearts <= 0) finishLevel('hearts');
      else nextQuestion();
    } else readQuestion();
  }

  // ---------- wiring ----------
  $('gameBack').onclick = goMap;
  $('ring').onclick = pause;
  $('pauseOv').onclick = resume;
  $('hear').onclick = () => { if (G && G.phase === 'ask') readQuestion(); };
  $('resMap').onclick = goMap;
  $('resRetry').onclick = () => { if (G) startLevel(G.level); };
  $('resNext').onclick = () => { const n = G && LEVELS[G.level.index + 1]; if (n) { $('resultOv').hidden = true; openBrief(n); } };
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (G && G.phase === 'ask' && /^[1-4]$/.test(e.key)) { const i = +e.key - 1; if (i < G.opts.length) choose(i); }
    else if (G && G.phase === 'paused' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); resume(); }
  });

  // grown-ups panel
  function syncSwitches() {
    $('swSound').setAttribute('aria-pressed', String(settings.sound));
    $('swRead').setAttribute('aria-pressed', String(settings.readAnswers));
    $('unlockAll').textContent = progress.unlockAll ? 'Lock levels again (normal play)' : 'Unlock every level';
  }
  $('gear').onclick = () => { syncSwitches(); $('grownOv').hidden = false; };
  $('grownClose').onclick = () => { $('grownOv').hidden = true; disarm(); renderMap(); };
  $('swSound').onclick = () => { settings.sound = !settings.sound; if (!settings.sound) stopSpeech(); saveSettings(); syncSwitches(); };
  $('swRead').onclick = () => { settings.readAnswers = !settings.readAnswers; saveSettings(); syncSwitches(); };
  $('unlockAll').onclick = () => { progress.unlockAll = !progress.unlockAll; saveProgress(); syncSwitches(); };
  let armTimer = null;
  function disarm() { clearTimeout(armTimer); const b = $('resetAll'); b.classList.remove('armed'); b.textContent = 'Reset all stars'; }
  $('resetAll').onclick = () => {
    const b = $('resetAll');
    if (!b.classList.contains('armed')) {
      b.classList.add('armed'); b.textContent = 'Tap again to delete all stars';
      armTimer = setTimeout(disarm, 3500);
    } else {
      progress.stars = {}; progress.unlockAll = false; saveProgress(); disarm(); syncSwitches();
      b.textContent = 'All stars reset';
    }
  };

  function boot() {
    goMap();
    requestAnimationFrame(frame);
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot();
})();
</script>
</body>
